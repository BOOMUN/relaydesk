name: agentdesk

x-agentdesk-service: &agentdesk-service
  image: agentdesk:latest
  env_file:
    - .env
  volumes:
    - ./data:/app/data
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - default
    - erpnext
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *agentdesk-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENTDESK_BIND_ADDRESS:-127.0.0.1}:${AGENTDESK_PUBLIC_PORT:-8100}:8000"
    networks:
      default:
      erpnext:
        aliases:
          - agentdesk-api
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  knowledge-worker:
    <<: *agentdesk-service
    command: ["python", "-u", "-m", "backend.app.knowledge_worker"]

  product-price-worker:
    <<: *agentdesk-service
    command: ["python", "-u", "-m", "backend.app.product_price_worker"]

  knowledge-scheduler:
    <<: *agentdesk-service
    command: ["python", "-u", "-m", "backend.app.knowledge_scheduler"]

  conversation-scheduler:
    <<: *agentdesk-service
    command: ["python", "-u", "-m", "backend.app.conversation_scheduler"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  redis-data:

networks:
  erpnext:
    external: true
    name: erpnext-monorepo_default
